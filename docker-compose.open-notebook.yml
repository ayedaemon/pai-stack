# docker-compose.open-notebook.yml (DEPRECATED)
# ─────────────────────────────────────────────────────────────────────────────
# The heavy Open Notebook + SurrealDB stack has been superseded by the native,
# zero-extra-container File-Based Research Brain (Markdown + YAML + Graft).
#
# Research notes and sources are now stored as standard Markdown in:
#   ${WORKSPACE_DIR}/research/<notebook-name>/
#
# All notebook_ops tools run natively inside mcp-server with zero extra containers,
# saving ~2.3 GB of RAM, eliminating external database dependencies, and avoiding
# Raspberry Pi 5 16 KB page-size jemalloc crashes.
#
# To run the complete stack:
#   make up
# ─────────────────────────────────────────────────────────────────────────────

services: {}
