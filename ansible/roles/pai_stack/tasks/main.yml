---
- name: Determine user UID and GID
  ansible.builtin.getent:
    database: passwd
    key: "{{ pai_user | default(ansible_user) }}"
  register: user_getent
  failed_when: false

- name: Set dynamic UID and GID facts
  ansible.builtin.set_fact:
    target_uid: "{{ user_getent.ansible_facts.getent_passwd[pai_user | default(ansible_user)][1] | default(pai_uid) }}"
    target_gid: "{{ user_getent.ansible_facts.getent_passwd[pai_user | default(ansible_user)][2] | default(pai_gid) }}"

- name: Default PERSONAL_FOLDER to target user's ~/Personal when not provided
  ansible.builtin.set_fact:
    pai_personal_dir: "{{ target_user_home }}/Personal"
  vars:
    target_user_home: "{{ user_getent.ansible_facts.getent_passwd[pai_user | default(ansible_user)][4] | default(ansible_facts['user_dir'], true) }}"
  when: pai_personal_dir | default('') | length == 0

- name: Ensure target deployment directory exists
  ansible.builtin.file:
    path: "{{ pai_stack_dir }}"
    state: directory
    owner: "{{ pai_user | default(ansible_user) }}"
    group: "{{ pai_user | default(ansible_user) }}"
    mode: "0755"

- name: Ensure persistent data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pai_user | default(ansible_user) }}"
    group: "{{ pai_user | default(ansible_user) }}"
    mode: "0755"
  loop:
    - "{{ pai_personal_dir }}"
    - "{{ pai_personal_dir }}/silverbulletKB"

- name: Check if existing .env file exists
  ansible.builtin.stat:
    path: "{{ pai_stack_dir }}/.env"
  register: existing_env_stat

- name: Read existing .env if present
  ansible.builtin.slurp:
    src: "{{ pai_stack_dir }}/.env"
  register: existing_env_slurp
  when: existing_env_stat.stat.exists

- name: Generate random API_SERVER_KEY if not specified
  ansible.builtin.command: openssl rand -hex 32
  register: generated_api_key_cmd
  changed_when: false
  when: not existing_env_stat.stat.exists and (api_server_key is not defined or api_server_key | length == 0)

- name: Generate random dashboard password if not specified
  ansible.builtin.command: openssl rand -hex 12
  register: generated_dash_pass_cmd
  changed_when: false
  when: not existing_env_stat.stat.exists and (hermes_dashboard_password is not defined or hermes_dashboard_password | length == 0)

- name: Generate random dashboard secret if not specified
  ansible.builtin.command: openssl rand -hex 32
  register: generated_dash_secret_cmd
  changed_when: false
  when: not existing_env_stat.stat.exists and (hermes_dashboard_secret is not defined or hermes_dashboard_secret | length == 0)

- name: Generate a random Syncthing GUI password (used as fallback)
  ansible.builtin.command: openssl rand -hex 12
  register: generated_syncthing_pass_cmd
  changed_when: false
  when: not existing_env_stat.stat.exists and (syncthing_gui_password is not defined or syncthing_gui_password | length == 0)

- name: Set secret facts for new installation
  ansible.builtin.set_fact:
    generated_api_server_key: "{{ api_server_key if (api_server_key is defined and api_server_key | length > 0) else generated_api_key_cmd.stdout }}"
    generated_hermes_dashboard_password: "{{ hermes_dashboard_password if (hermes_dashboard_password is defined and hermes_dashboard_password | length > 0) else generated_dash_pass_cmd.stdout }}"
    generated_hermes_dashboard_secret: "{{ hermes_dashboard_secret if (hermes_dashboard_secret is defined and hermes_dashboard_secret | length > 0) else generated_dash_secret_cmd.stdout }}"
    generated_syncthing_gui_user: "{{ syncthing_gui_user if (syncthing_gui_user is defined and syncthing_gui_user | length > 0) else 'admin' }}"
    generated_syncthing_gui_password: "{{ syncthing_gui_password if (syncthing_gui_password is defined and syncthing_gui_password | length > 0) else generated_syncthing_pass_cmd.stdout }}"
  when: not existing_env_stat.stat.exists



- name: Generate fallback Syncthing GUI password if still empty (upgrade path)
  ansible.builtin.command: openssl rand -hex 12
  register: generated_syncthing_pass_fallback
  changed_when: false
  when: existing_env_stat.stat.exists and (generated_syncthing_gui_password | default('') | length == 0)

- name: Set fallback Syncthing password fact (upgrade path)
  ansible.builtin.set_fact:
    generated_syncthing_gui_password: "{{ generated_syncthing_pass_fallback.stdout }}"
  when: generated_syncthing_pass_fallback is defined and generated_syncthing_pass_fallback.stdout is defined and generated_syncthing_pass_fallback.stdout | length > 0

- name: Preserve existing secrets from .env
  ansible.builtin.command:
    cmd: "python3 -c \"import json, re; d = open('{{ pai_stack_dir }}/.env', encoding='utf-8').read(); keys = ['API_SERVER_KEY', 'HERMES_DASHBOARD_BASIC_AUTH_PASSWORD', 'HERMES_DASHBOARD_BASIC_AUTH_SECRET', 'SYNCTHING_GUI_USER', 'SYNCTHING_GUI_PASSWORD']; print(json.dumps({k: m.group(1).strip() for k in keys for m in [re.search('^' + k + '=(.+)$', d, re.M)] if m}))\""
  register: existing_secrets
  when: existing_env_stat.stat.exists
  changed_when: false

- name: Set secret facts from existing .env
  ansible.builtin.set_fact:
    generated_api_server_key: "{{ (existing_secrets.stdout | from_json).API_SERVER_KEY | default(api_server_key) }}"
    generated_hermes_dashboard_password: "{{ (existing_secrets.stdout | from_json).HERMES_DASHBOARD_BASIC_AUTH_PASSWORD | default(hermes_dashboard_password) }}"
    generated_hermes_dashboard_secret: "{{ (existing_secrets.stdout | from_json).HERMES_DASHBOARD_BASIC_AUTH_SECRET | default(hermes_dashboard_secret) }}"
    generated_syncthing_gui_user: "{{ (existing_secrets.stdout | from_json).SYNCTHING_GUI_USER | default(syncthing_gui_user | default('admin')) }}"
    generated_syncthing_gui_password: "{{ (existing_secrets.stdout | from_json).SYNCTHING_GUI_PASSWORD | default(syncthing_gui_password | default('')) | default(generated_syncthing_pass_cmd.stdout | default(''), true) }}"
  when: existing_env_stat.stat.exists

- name: Template .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ pai_stack_dir }}/.env"
    owner: "{{ pai_user | default(ansible_user) }}"
    group: "{{ pai_user | default(ansible_user) }}"
    mode: "0600"
  register: env_template_result

- name: Remove stale build-context dirs (prevent nested/missing files from prior runs)
  ansible.builtin.file:
    path: "{{ pai_stack_dir }}/{{ item }}"
    state: absent
  loop:
    - caddy
    - codegraph
    - hermes

- name: Ensure build-context directories exist (copy needs existing parents)
  ansible.builtin.file:
    path: "{{ pai_stack_dir }}/{{ item }}"
    state: directory
    owner: "{{ pai_user | default(ansible_user) }}"
    group: "{{ pai_user | default(ansible_user) }}"
    mode: "0755"
  loop:
    - caddy
    - codegraph
    - hermes

- name: Copy project files (explicit file copies to avoid directory nesting)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item.src }}"
    dest: "{{ pai_stack_dir }}/{{ item.dest }}"
    owner: "{{ pai_user | default(ansible_user) }}"
    group: "{{ pai_user | default(ansible_user) }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "docker-compose.yaml", dest: "docker-compose.yaml", mode: "0644" }
    - { src: "caddy/Dockerfile", dest: "caddy/Dockerfile", mode: "0644" }
    - { src: "codegraph/Dockerfile", dest: "codegraph/Dockerfile", mode: "0644" }
    - { src: "codegraph/package.json", dest: "codegraph/package.json", mode: "0644" }
    - { src: "codegraph/server.js", dest: "codegraph/server.js", mode: "0644" }
    - { src: "hermes/entrypoint.sh", dest: "hermes/entrypoint.sh", mode: "0755" }
    - { src: "hermes/Dockerfile", dest: "hermes/Dockerfile", mode: "0644" }
    - { src: "hermes/apply-kanban-patch.py", dest: "hermes/apply-kanban-patch.py", mode: "0644" }
    - { src: "caddy/Caddyfile", dest: "caddy/Caddyfile", mode: "0644" }
  register: pai_stack_copy_result

- name: Template hermes config.yaml (reads llamacpp_base_url and llamacpp_model_name from .env)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../hermes/config.yaml.j2"
    dest: "{{ pai_stack_dir }}/hermes/config.yaml"
    owner: "{{ pai_user | default(ansible_user) }}"
    group: "{{ pai_user | default(ansible_user) }}"
    mode: "0644"
  register: hermes_config_result

- name: Seed knowledge base scaffold into SilverBullet note space (never overwrite user edits)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../kb/"
    dest: "{{ pai_personal_dir }}/silverbulletKB/"
    owner: "{{ pai_user | default(ansible_user) }}"
    group: "{{ pai_user | default(ansible_user) }}"
    mode: "preserve"
    force: no

- name: Verify build contexts are flat (catch nested Dockerfiles early)
  ansible.builtin.stat:
    path: "{{ pai_stack_dir }}/{{ item }}/Dockerfile"
  loop:
    - caddy
    - codegraph
  register: dockerfile_stats

- name: Fail fast if a build-context Dockerfile is missing at root
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "Build context missing Dockerfile at root: {{ pai_stack_dir }}/{{ item.item }}/Dockerfile"
  loop: "{{ dockerfile_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure PERSONAL_FOLDER exists for Syncthing sync (the folder it serves to the outside world)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pai_user | default(ansible_user) }}"
    group: "{{ pai_user | default(ansible_user) }}"
    mode: "0755"
  loop:
    - "{{ pai_personal_dir }}"
    - "{{ pai_personal_dir }}/silverbulletKB"

- name: Remove any leftover Syncthing Docker container (now runs on the host)
  ansible.builtin.command: docker rm -f syncthing
  args:
    chdir: "{{ pai_stack_dir }}"
  register: syncthing_rm
  changed_when: syncthing_rm.rc == 0
  failed_when: false

- name: Install Syncthing on the host (apt)
  ansible.builtin.apt:
    name: syncthing
    state: present
    cache_valid_time: 3600
  become: true

- name: Ensure Syncthing config directory exists
  ansible.builtin.file:
    path: /var/lib/syncthing
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true

- name: Generate Syncthing config if missing (creates certs + device ID)
  ansible.builtin.command: syncthing --generate=/var/lib/syncthing
  args:
    creates: /var/lib/syncthing/config.xml
  register: syncthing_generate_result
  become: true

- name: Ensure Syncthing owns its config directory
  ansible.builtin.file:
    path: /var/lib/syncthing
    state: directory
    recurse: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true

- name: Stop Syncthing before patching config (avoid it rewriting on exit)
  ansible.builtin.systemd:
    name: syncthing
    state: stopped
  become: true
  failed_when: false

- name: Read current Syncthing config (after stop to avoid race)
  ansible.builtin.slurp:
    path: /var/lib/syncthing/config.xml
  register: syncthing_cfg_slurp
  become: true

- name: Disable Syncthing anonymous usage reporting (telemetry)
  ansible.builtin.replace:
    path: /var/lib/syncthing/config.xml
    regexp: '<urAccepted>[0-9-]*</urAccepted>'
    replace: '<urAccepted>-1</urAccepted>'
  become: true

- name: Point Syncthing default folder at PERSONAL_FOLDER
  ansible.builtin.replace:
    path: /var/lib/syncthing/config.xml
    regexp: '(<folder[^>]*path=")[^"]*(")'
    replace: '\1{{ pai_personal_dir }}\2'
  become: true

- name: Set Syncthing default folder ID to 'personal'
  ansible.builtin.replace:
    path: /var/lib/syncthing/config.xml
    regexp: '<folder id="[^"]*"'
    replace: '<folder id="personal"'
  become: true

- name: "Bind Syncthing GUI on host port 8385 (Caddy proxies :8384 with Tailscale TLS)"
  ansible.builtin.replace:
    path: /var/lib/syncthing/config.xml
    regexp: '127\.0\.0\.1:8384'
    replace: '0.0.0.0:8385'
  become: true

- name: "Set Syncthing listen addresses for Tailscale connectivity"
  ansible.builtin.replace:
    path: /var/lib/syncthing/config.xml
    regexp: '(<options>\s*<address>).*?(</address>)'
    replace: '\g<1>tcp://0.0.0.0:22000, quic://0.0.0.0:22000\g<2>'
  become: true

- name: Compute Syncthing GUI basic-auth hash (bcrypt) — only when missing
  ansible.builtin.command:
    cmd: python3 -c "import bcrypt, os; print(bcrypt.hashpw(os.environ['P'].encode(), bcrypt.gensalt(rounds=12)).decode())"
  environment:
    P: "{{ generated_syncthing_gui_password }}"
  register: syncthing_hash_cmd
  changed_when: false
  when: "'<user>' not in (syncthing_cfg_slurp.content | b64decode)"

- name: Set Syncthing GUI hash fact
  ansible.builtin.set_fact:
    syncthing_gui_password_hash: "{{ syncthing_hash_cmd.stdout }}"
  when: syncthing_hash_cmd is defined and syncthing_hash_cmd.stdout is defined

- name: Set Syncthing GUI basic auth (user/password) in config.xml
  ansible.builtin.replace:
    path: /var/lib/syncthing/config.xml
    regexp: '(</gui>)'
    replace: '    <user>{{ generated_syncthing_gui_user }}</user>\n    <password>{{ syncthing_gui_password_hash }}</password>\n\1'
  when: "'<user>' not in (syncthing_cfg_slurp.content | b64decode)"
  become: true

- name: Ensure Syncthing folder marker (.stfolder) exists
  ansible.builtin.file:
    path: "{{ pai_personal_dir }}/.stfolder"
    state: touch
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  become: true

- name: Install Syncthing systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Syncthing (pai-stack)
      After=network.target

      [Service]
      ExecStart=/usr/bin/syncthing serve --home=/var/lib/syncthing
      User={{ ansible_user }}
      Group={{ ansible_user }}
      Restart=always
      RestartSec=5
      Nice=10

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/syncthing.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Reload systemd and enable/start Syncthing
  ansible.builtin.systemd:
    name: syncthing
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Wait for Syncthing to listen on 8385 (with diagnostics)
  block:
    - name: Wait for Syncthing to listen on 8385
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8385
        delay: 3
        timeout: 90
  rescue:
    - name: Get Syncthing service status (on wait failure)
      ansible.builtin.command: systemctl status syncthing --no-pager
      register: syncthing_status_rescue
      failed_when: false
      become: true

    - name: Get Syncthing journal (on wait failure)
      ansible.builtin.command: journalctl -u syncthing -n 100 --no-pager
      register: syncthing_journal_rescue
      failed_when: false
      become: true

    - name: Show Syncthing failure diagnostics
      ansible.builtin.debug:
        msg:
          - "Syncthing failed to listen on 127.0.0.1:8385 within 90s (Caddy will proxy 8384 → 8385 via Tailscale TLS)"
          - "systemctl status: {{ syncthing_status_rescue.stdout | default('N/A') }}"
          - "journal: {{ syncthing_journal_rescue.stdout | default('N/A') }}"

    - name: Fail with diagnostics
      ansible.builtin.fail:
        msg: "Syncthing did not start on 8385 — check /var/lib/syncthing ownership (should be {{ ansible_user }}) and GUI <address>0.0.0.0:8385</address> in config.xml"

- name: Build Docker Compose images (only when build context changed)
  ansible.builtin.command: docker compose build --parallel
  args:
    chdir: "{{ pai_stack_dir }}"
  register: compose_build_result
  changed_when: compose_build_result.rc == 0
  when: pai_stack_copy_result.changed or hermes_config_result.changed

- name: Start Docker Compose services
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ pai_stack_dir }}"
  register: compose_up_result
  changed_when: "'Started' in compose_up_result.stdout or 'Creating' in compose_up_result.stdout or 'Recreating' in compose_up_result.stdout"

- name: Retrieve Tailscale IP / hostname for display (reuse fact if available)
  ansible.builtin.command: tailscale ip -4
  register: ts_ip_res
  changed_when: false
  failed_when: false
  when: tailscale_ipv4 is not defined

- name: Set Tailscale IP fact from reuse
  ansible.builtin.set_fact:
    ts_ip_display: "{{ tailscale_ipv4 | default(ts_ip_res.stdout | default('N/A')) }}"
  changed_when: false

- name: Display Stack Access Summary
  ansible.builtin.debug:
    msg:
      - "=================================================================="
      - "  PAI-STACK DEPLOYMENT SUCCESSFUL                                 "
      - "=================================================================="
      - "Target Server:    {{ inventory_hostname }} (Tailscale IP: {{ ts_ip_display | default('N/A') }})"
      - "Tailscale Domain: {{ tailscale_domain }}"
      - ""
      - "Services (Accessed securely via Tailscale HTTPS):"
      - "  - Hermes Dashboard:   https://{{ tailscale_domain }}:9119"
      - "      Username:         {{ hermes_dashboard_username }}"
      - "      Password:         {{ generated_hermes_dashboard_password }}"
      - ""
      - "  - Hermes API Server:  https://{{ tailscale_domain }}:8642"
      - "      API Key:          {{ generated_api_server_key }}"
      - ""
      - "  - Syncthing GUI:      https://{{ tailscale_domain }}:8384"
      - "      Username:         {{ generated_syncthing_gui_user }}"
      - "      Password:         {{ generated_syncthing_gui_password }}"
      - "      Sync Path:        {{ pai_personal_dir }}"
      - ""
      - "  - CodeGraph API:     Internal only (http://codegraph:20128)"
      - "      Status:           {{ 'Enabled' if codegraph_enabled | default('true') | bool else 'Disabled' }}"
      - "=================================================================="
