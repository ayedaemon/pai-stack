---
- name: Deploy pai-stack
  hosts: all
  gather_facts: yes

  vars_files:
    - group_vars/all.yml

  tasks:
    # ── 0. Detect user UID/GID ──────────────────────────────────
    - name: Detect user UID and GID
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user }}"
      register: user_getent
      failed_when: false

    - name: Set UID/GID facts
      ansible.builtin.set_fact:
        target_uid: "{{ user_getent.ansible_facts.getent_passwd[ansible_user][1] | default('1000') }}"
        target_gid: "{{ user_getent.ansible_facts.getent_passwd[ansible_user][2] | default('1000') }}"

    # ── 1. Tailscale (optional — skip if no auth key) ──────────
    - name: Add Tailscale GPG key
      ansible.builtin.apt_key:
        url: https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg
        state: present
      become: true
      when: tailscale_auth_key | default('') | length > 0

    - name: Add Tailscale repo
      ansible.builtin.apt_repository:
        repo: deb https://pkgs.tailscale.com/stable/debian bookworm main
        state: present
      become: true
      when: tailscale_auth_key | default('') | length > 0

    - name: Install tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        cache_valid_time: 3600
      become: true
      when: tailscale_auth_key | default('') | length > 0

    - name: Join tailnet
      ansible.builtin.command: >
        tailscale up --authkey={{ tailscale_auth_key }}
        --hostname={{ inventory_hostname }}
      become: true
      when: tailscale_auth_key | default('') | length > 0

    - name: Set Tailscale operator
      ansible.builtin.command: >
        tailscale set --operator={{ ansible_user }}
      become: true
      when: tailscale_auth_key | default('') | length > 0

    # ── 2. Docker ───────────────────────────────────────────────
    - name: Check if Docker is installed
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Install Docker via get.docker.com
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker
      when: docker_check.rc != 0

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
      become: true

    # ── 3. Create directories ───────────────────────────────────
    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      loop:
        - "{{ pai_personal_dir }}"
        - "{{ pai_personal_dir }}/silverbulletKB"
        - "{{ pai_stack_dir }}"

    # ── 4. Clone repo ───────────────────────────────────────────
    - name: Clone pai-stack repo
      ansible.builtin.git:
        repo: "{{ pai_repo_url }}"
        dest: "{{ pai_stack_dir }}"
        force: yes

    # ── 5. Generate secrets ─────────────────────────────────────
    - name: Generate API server key
      ansible.builtin.command: openssl rand -hex 32
      register: gen_api_key
      changed_when: false

    - name: Generate dashboard password
      ansible.builtin.command: openssl rand -hex 12
      register: gen_dash_pass
      changed_when: false

    - name: Generate dashboard secret
      ansible.builtin.command: openssl rand -hex 32
      register: gen_dash_secret
      changed_when: false

    - name: Generate Syncthing GUI password
      ansible.builtin.command: openssl rand -hex 12
      register: gen_syncthing_pass
      changed_when: false

    - name: Set secret facts
      ansible.builtin.set_fact:
        generated_api_key: "{{ api_server_key | default('', true) | length > 0 | ternary(api_server_key, gen_api_key.stdout) }}"
        generated_dash_pass: "{{ hermes_dashboard_password | default('', true) | length > 0 | ternary(hermes_dashboard_password, gen_dash_pass.stdout) }}"
        generated_dash_secret: "{{ gen_dash_secret.stdout }}"
        generated_syncthing_pass: "{{ syncthing_gui_password | default('', true) | length > 0 | ternary(syncthing_gui_password, gen_syncthing_pass.stdout) }}"

    # ── 6. Template configs (overwrite every deploy) ────────────
    - name: Template .env
      ansible.builtin.template:
        src: env.j2
        dest: "{{ pai_stack_dir }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Template hermes config
      ansible.builtin.template:
        src: hermes/config.yaml.j2
        dest: "{{ pai_stack_dir }}/hermes/config.yaml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    # ── 7. Seed KB scaffold ─────────────────────────────────────
    - name: Seed KB scaffold
      ansible.builtin.copy:
        src: kb/
        dest: "{{ pai_personal_dir }}/silverbulletKB/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "preserve"
        force: no

    # ── 8. Syncthing (host service) ────────────────────────────
    - name: Install Syncthing
      ansible.builtin.apt:
        name: syncthing
        state: present
        cache_valid_time: 3600
      become: true

    - name: Ensure Syncthing config directory exists
      ansible.builtin.file:
        path: /var/lib/syncthing
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      become: true

    - name: Generate Syncthing config if missing
      ansible.builtin.command: syncthing --generate=/var/lib/syncthing
      args:
        creates: /var/lib/syncthing/config.xml
      become: true

    - name: Stop Syncthing before patching config
      ansible.builtin.systemd:
        name: syncthing
        state: stopped
      become: true
      failed_when: false

    - name: Read Syncthing config
      ansible.builtin.slurp:
        path: /var/lib/syncthing/config.xml
      register: syncthing_cfg
      become: true

    - name: Configure Syncthing — disable telemetry
      ansible.builtin.replace:
        path: /var/lib/syncthing/config.xml
        regexp: '<urAccepted>[0-9-]*</urAccepted>'
        replace: '<urAccepted>-1</urAccepted>'
      become: true

    - name: Configure Syncthing — point folder at STACK_ROOT
      ansible.builtin.replace:
        path: /var/lib/syncthing/config.xml
        regexp: '(<folder[^>]*path=")[^"]*(")'
        replace: '\1{{ pai_personal_dir }}\2'
      become: true

    - name: Configure Syncthing — set folder ID to personal
      ansible.builtin.replace:
        path: /var/lib/syncthing/config.xml
        regexp: '<folder id="[^"]*"'
        replace: '<folder id="personal"'
      become: true

    - name: Configure Syncthing — bind GUI to 0.0.0.0:8384
      ansible.builtin.replace:
        path: /var/lib/syncthing/config.xml
        regexp: '127\.0\.0\.1:8384'
        replace: '0.0.0.0:8384'
      become: true

    - name: Configure Syncthing — set listen addresses
      ansible.builtin.replace:
        path: /var/lib/syncthing/config.xml
        regexp: '(<options>\s*<address>).*?(</address>)'
        replace: '\g<1>tcp://0.0.0.0:22000, quic://0.0.0.0:22000\g<2>'
      become: true

    - name: Generate Syncthing GUI password hash
      ansible.builtin.shell: |
        python3 -c "import bcrypt; print(bcrypt.hashpw(b'{{ generated_syncthing_pass }}', bcrypt.gensalt(rounds=12)).decode())"
      register: syncthing_hash
      changed_when: false
      when: "'<user>' not in (syncthing_cfg.content | b64decode)"
      become: true

    - name: Configure Syncthing — set GUI basic auth
      ansible.builtin.replace:
        path: /var/lib/syncthing/config.xml
        regexp: '(</gui>)'
        replace: '    <user>{{ syncthing_gui_user }}</user>\n    <password>{{ syncthing_hash.stdout }}</password>\n\1'
      when: "'<user>' not in (syncthing_cfg.content | b64decode)"
      become: true

    - name: Ensure Syncthing folder marker exists
      ansible.builtin.file:
        path: "{{ pai_personal_dir }}/.stfolder"
        state: touch
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      become: true

    - name: Install Syncthing systemd unit
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Syncthing (pai-stack)
          After=network.target

          [Service]
          ExecStart=/usr/bin/syncthing serve --home=/var/lib/syncthing
          User={{ ansible_user }}
          Group={{ ansible_user }}
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/syncthing.service
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Start Syncthing
      ansible.builtin.systemd:
        name: syncthing
        state: started
        enabled: true
        daemon_reload: true
      become: true

    # ── 9. Build & start containers ────────────────────────────
    - name: Build Docker images
      ansible.builtin.command: docker compose build
      args:
        chdir: "{{ pai_stack_dir }}"

    - name: Start Docker Compose services
      ansible.builtin.command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ pai_stack_dir }}"

    # ── 10. Display access summary ──────────────────────────────
    - name: Get Tailscale IP
      ansible.builtin.command: tailscale ip -4
      register: ts_ip
      changed_when: false
      failed_when: false

    - name: Display access summary
      ansible.builtin.debug:
        msg:
          - "=================================================================="
          - "  PAI-STACK DEPLOYMENT SUCCESSFUL"
          - "=================================================================="
          - "Target:    {{ inventory_hostname }} ({{ ts_ip.stdout | default('N/A') }})"
          - ""
          - "Services (accessed via Tailscale IP):"
          - "  Hermes Dashboard:  https://{{ ts_ip.stdout | default('N/A') }}:9119"
          - "    Password:        {{ generated_dash_pass }}"
          - "  Hermes API:        https://{{ ts_ip.stdout | default('N/A') }}:8642"
          - "    API Key:         {{ generated_api_key }}"
          - "  Syncthing GUI:     https://{{ ts_ip.stdout | default('N/A') }}:8384"
          - "    User:            {{ syncthing_gui_user }}"
          - "    Password:        {{ generated_syncthing_pass }}"
          - "  CodeGraph:         Internal (http://codegraph:20128)"
          - "=================================================================="
