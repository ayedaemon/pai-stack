---
# Target host paths
pai_stack_dir: "{{ ansible_facts['user_dir'] }}/deployed-pai-stack"
pai_stack_root: "{{ ansible_facts['user_dir'] }}/stack_root"

# Container user (resolved from SSH connection)
pai_user: "{{ ansible_user | default(ansible_user_id, true) }}"

# Git repo to deploy
pai_repo_url: "https://github.com/ayedaemon/pai-stack.git"

# Tailscale (passed via extra vars from .env)
tailscale_auth_key: ""

# LLM Provider
llamacpp_base_url: "http://localhost:8080/v1"
llamacpp_model_name: "nemotron-3-nano-omni-30b-a3b-reasoning-q4-k-m"

# Provider API keys (blank = skip)
openrouter_api_key: ""
kilo_gateway_api_key: ""
mistral_api_key: ""

# Hermes secrets (blank = auto-generate)
hermes_dashboard_password: ""
api_server_key: ""

# Syncthing GUI auth
syncthing_gui_user: "admin"
syncthing_gui_password: ""

# CodeGraph
codegraph_enabled: true

# fs-notifier debounce (seconds)
fs_notifier_debounce_seconds: 30

# KB directories to index (comma-separated, relative to STACK_ROOT)
kb_dirs: "."
