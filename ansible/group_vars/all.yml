---
# ==============================================================================
# pai-stack Configuration & Secrets
# ==============================================================================

# Target Host Deployment Paths
pai_stack_dir: "{{ ansible_facts[\"user_dir\"] }}/pai-stack"
pai_personal_dir: "{{ ansible_facts[\"user_dir\"] }}/Personal"

# Container User & Permission Mapping (matches host user UID/GID)
# Resolves from the SSH connection user (deploy.sh passes TARGET_USER via -u).
# Falls back to the fact-gathered login user so manual runs without -u still
# target the right account instead of failing on undefined ansible_user.
pai_user: "{{ ansible_user | default(ansible_user_id, true) }}"
pai_uid: 1000
pai_gid: 1000

# Tailscale TLS & Domain Configuration
# Passed via extra-vars from .env
tailscale_domain: ""

# Tailscale Node Setup (Optional if machine is already on Tailscale)
tailscale_auth_key: ""
tailscale_args: ""

# ── LLM Provider ────────────────────────────────────────────────────────
llamacpp_base_url: "http://localhost:8080/v1"
llamacpp_model_name: "nemotron-3-nano-omni-30b-a3b-reasoning-q4-k-m"

# Hermes Agent & Provider Secrets
# If left empty, secure random 32-byte hex keys/passwords will be generated on setup
openrouter_api_key: ""
kilo_gateway_api_key: ""
mistral_api_key: ""
api_server_key: ""
hermes_dashboard_username: "admin"
hermes_dashboard_password: ""
hermes_dashboard_secret: ""

# CodeGraph — code intelligence for Hermes
codegraph_enabled: true
