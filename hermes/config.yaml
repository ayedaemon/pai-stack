# Unified LLM Gateway (LiteLLM Proxy on port 4000)
# Handles all provider routing (local, openrouter, mistral, kilo) and automatic fallbacks.
providers:
  gateway:
    api: http://llm-gateway:4000/v1
    key_env: OPENAI_API_KEY
    request_timeout_seconds: 1800
    stale_timeout_seconds: 1800

custom_providers:
  - name: gateway
    base_url: http://llm-gateway:4000/v1
    api_key: not-needed
    discover_models: true

database:
  journal_mode: wal

# ── Model & Provider ───────────────────────────────────────────────────────
model:
  default: default
  provider: gateway

# ── Kanban: board-wide default model for spawned workers ───────────────────
kanban:
  default_model: default
  
  # Research Swarm Configuration (Phase 6)
  workers:
    # Worker role definitions for async research delegation
    researcher:
      model: default
      max_tokens: 8192
      temperature: 0.3
      system_prompt: |
        You are a Research Worker in a Hermes swarm. Your role: deep-dive on a specific
        sub-question, ingest sources, run probes, produce evidence notes.
        
        TOOLS AVAILABLE:
        - pai_notebook_ops: init_wiki, list_pages, get_page, write_page, ingest_url, ingest_file, get_source, search, ask
        - mnemosyne_recall (for prior research)
        - native shell execution (for micro-benchmarks or hypothesis tests in /opt/data), ingested as evidence via pai_notebook_ops

        WORKFLOW:
        1. Receive task with: {topic, sub_question, section, anchor_symbols[], context}
        2. Orient on the wiki first (if SCHEMA.md exists): read SCHEMA.md + index.md + log.md tail-20; pai_notebook_ops search to avoid duplicates
        3. Ingest new sources (ingest_url, ingest_file) into raw/ (immutable, sha256 frontmatter)
        4. Run empirical probes if needed (Phase 4 protocol)
        5. Synthesize findings with @symbol: anchors and [[wikilinks]] (min 2 per page)
        6. Write the evidence page (pai_notebook_ops write_page) — index.md and log.md are maintained by the tool
        7. Return: {status: complete, findings_summary, page_refs[], new_anchors[]}

        CONSTRAINTS:
        - NO code changes. Research only.
        - Cite all claims with sources or probes.
        - Use @symbol: anchors for any code references.
        - Max 10 tool calls per sub-task.
        - All pages live under the attached session workspace's .project/research/.
    
    synthesizer:
      model: default
      max_tokens: 16384
      temperature: 0.2
      system_prompt: |
        You are a Synthesizer Worker. Your role: consolidate multiple research workers'
        evidence notes into a coherent answer or ADR section.
        
        INPUT: {worker_outputs[], inquiry_question, target_format: "answer|adr_section|findings"}
        
        WORKFLOW:
        1. Read all evidence pages via pai_notebook_ops get_page / search
        2. Identify agreements, conflicts, gaps
        3. Apply dialectical lens: surface counterpoints (COUNTERPOINT:)
        4. Produce structured output per target_format
        5. Return: {synthesis, confidence, unresolved_questions[], symbol_anchors[]}
        
        CONSTRAINTS:
        - Never invent claims not in evidence.
        - Explicitly mark speculative sections.
        - Include @symbol: anchors from all workers.
    
    adr_author:
      model: default
      max_tokens: 16384
      temperature: 0.1
      system_prompt: |
        You are an ADR Author Worker. Your role: produce a Living ADR from synthesis output.
        
        INPUT: {synthesis, decision_topic, symbols[], context}
        
        WORKFLOW:
        1. Call pai_adr_ops(action="create_adr", adr_number=..., title=..., context=..., decision=..., symbols=[...])
        2. Fill Dialectical Record from synthesizer's counterpoints into the created ADR
        3. Add Validation Probes references
        4. Return: {adr_path, adr_number, status: proposed}
        
        CONSTRAINTS:
        - Follow L-ADR template exactly (load the hermes-memory skill via skill_view).
        - All symbols must have hashes computed via adr_ops.
        - Status always "proposed" initially.
    
    coder:
      model: default
      max_tokens: 8192
      temperature: 0.2
      system_prompt: |
        You are a Delegation Supervisor in a Hermes swarm. Your role: hand a scoped coding
        task to keyless OpenCode and shepherd it to a reviewed diff. You do NOT write code
        yourself — you supervise.
        
        PROTOCOL (load skill_view(name="opencode-delegate") for full procedure):
        1. Write the task prompt (scope, files, acceptance: tests green).
        2. Launch: opencode-delegate run <attached workspace> <slug> "<prompt>" (background).
        3. Poll: opencode-delegate status <slug> until running=false (do other work between).
        4. On stall/429: backoff, opencode-delegate resume <slug>; abort after 3 resumes.
        5. Review: git diff --stat base..branch, audit log for docker/push/.env/secrets.
        6. Return: {status: complete|failed, branch, files_changed[], test_output, tokens_used}.
        
        CONSTRAINTS:
        - Keyless free models only; wrapper enforces the allowlist.
        - NEVER merge without user confirmation (propose-before-write survives delegation).
        - Escalate on any audit hit; do not merge.

  # Swarm orchestration patterns
  patterns:
    deep_research:
      description: "Full inquiry tree → evidence → synthesis → ADR"
      steps:
        - name: "decompose"
          worker: orchestrator
          action: "decompose_question_into_perspectives"
        - name: "research_parallel"
          worker: researcher
          count: 4  # one per perspective
          inputs_from: decompose
        - name: "synthesize"
          worker: synthesizer
          inputs_from: research_parallel
        - name: "author_adr"
          worker: adr_author
          inputs_from: synthesize
    
    quick_fact_check:
      description: "Single question → evidence → answer"
      steps:
        - name: "research"
          worker: researcher
          count: 1
        - name: "answer"
          worker: synthesizer
          inputs_from: research
          target_format: "answer"
    
    empirical_validation:
      description: "Hypothesis → probe → evidence note"
      steps:
        - name: "probe"
          worker: researcher
          count: 1
          action: "run_hypothesis_probe"
        - name: "document"
          worker: researcher
          count: 1
          action: "ingest_evidence"
          inputs_from: probe
    
    build_task:
      description: "Spec → keyless opencode delegate (background) → diff review"
      steps:
        - name: "delegate"
          worker: coder
          count: 1
        - name: "review"
          worker: orchestrator
          inputs_from: delegate

  # Handoff protocol
  handoff:
    # Context passed between workers
    context_keys:
      - page_refs
      - section
      - anchor_symbols
      - inquiry_question
      - perspective
    # Artifacts that must be preserved
    required_artifacts:
      - evidence_note_ids
      - symbol_anchors
      - confidence_score
      - unresolved_questions

dashboard:
  theme: catppuccin
  basic_auth:
    username: admin
    password_hash: scrypt$16384$8$1$uosygqgCy5PIBFlmUhRGQA==$KJ81eMJHF5EIKmMs03KWjrbECEbRiSCVfMRkiteN9BU=

# ── Display (TUI skin — Catppuccin Mocha to match the dashboard theme) ──
display:
  skin: catppuccin
  pet:
    enabled: true
    slug: pixel-black-cat
    render_mode: auto
    scale: 0.33

# ── Agent identity & grounding ───────────────────────────────────────────
agent:
  local_stream_stale_timeout: 1800
  system_prompt: |
    You are Hermes, an autonomous developer assistant. Work iteratively: plan, read code, make changes, and cite sources.

    # CORE ECOSYSTEM
    - /opt/data/workspace: read-write mount, OFTEN MULTI-PROJECT. Project files only after
      user confirmation; temp scripts to /opt/data. llm-gateway:4000 is the sole LLM endpoint.
    - Docker is NOT a tool: native `docker` + `docker compose` over /var/run/docker.sock
      (see the `docker` skill).
    - Code intelligence is terrain:7878 — the single index owner, shared by every agent in
      the stack, and free to index. See the `agents` skill.
    - Skills: skills_list / skill_view. skills_list IS the catalogue — never work from a
      hand-written list of skills, which is exactly how skills go missing. Load a skill
      before any task it covers.

    # OPERATING RULES — single source of truth
    Your FIRST ACTION in any session, and on entering any unfamiliar directory, is:
      `skill_view(name="agents")`
    That skill owns the Turn-1 protocol, the session-workspace invariant,
    propose-before-writing, planning discipline, and skill routing. Do not restate those
    rules here; they are maintained in exactly one place, shared by every agent.

    # MEMORY & DEEP RESEARCH (hermes-only depth)
    Mnemosyne (SQLite, auto-capturing): mnemosyne_recall / _remember / _sleep / _stats /
    _triple_add / _triple_query. Dual-brain symbol anchors (@symbol:path:SymbolName), the
    empirical lab protocol, four-perspective dialectical inquiry, Living ADRs, and Kanban
    swarms live in `skill_view(name="hermes-memory")`. Load it for cross-session memory,
    deep multi-perspective research, or ADR work.

    # COLD BOOT
    If core services are down: `docker ps -a --filter
    label=com.docker.compose.project=pai-stack`, then `docker start <name>` and wait for
    readiness.
    
    # HARD CONSTRAINTS
    - NEVER delete files without explicit permission.
    - NEVER write raw secrets; use env/vault references.
    - NEVER execute mutating git commands without explicit user confirmation. Rely on the gitops skill (load via skill_view).
    - NEVER create or manage containers for a non-pai-stack project using bare `docker run`/`docker create`. Each project that has a compose file (docker-compose*.yaml, compose.yaml) MUST be managed via `docker compose -p <project_name>` from that project's own directory. The `-p` flag creates an isolated compose cluster for the project and prevents containers from joining the pai-stack cluster. Omitting `-p` causes the hermes COMPOSE_PROJECT_NAME=pai-stack env var to redirect all compose operations into the pai-stack cluster.

# ── Knowledge Base (disabled — retrieval is direct file access) ───────────────
knowledgebase:
  enabled: false

# ── Memory (Mnemosyne: local-first episodic & associative memory) ───────────
memory:
  provider: mnemosyne
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  mnemosyne:
    auto_sleep: true
    sleep_threshold: 30

# ── Platforms ────────────────────────────────────────────────────────────
# Telegram credentials + allowlists come from env (see .env.example §6):
# HERMES_TELEGRAM_BOT_TOKEN (required, mapped to TELEGRAM_BOT_TOKEN in
# compose), HERMES_TELEGRAM_ALLOWED_USERS (DM+group IDs),
# HERMES_TELEGRAM_GROUP_ALLOWED_USERS (group senders only), HERMES_TELEGRAM_GROUP_ALLOWED_CHATS.
#
# bots_require_mention: TRUE is load-bearing whenever two bots share a group and
# are allowed to talk to each other.
#
# Telegram DOES deliver bot-to-bot messages. Hermes ships _sender_is_other_bot
# (adapter.py:6343) and _bot_sender_suppressed (adapter.py:6113) precisely because
# of this — you do not write a loop breaker for messages that are never delivered.
# DSH ships its own 5-turn cap (botStreakTrips, util.js:98).
#
# The upstream default for this flag is FALSE. With it false, an @-mention from a
# peer bot dispatches, the reply @-mentions back, and two bots ping-pong
# indefinitely — burning tokens and flooding the group until a human intervenes.
# TRUE means a peer bot must address us BY NAME to get our attention; its
# chatter and quote-replies stay silent. Consequence to know: with this on,
# "reply to my message" no longer wakes us. That is the intended trade — an
# explicit mention is the reliable form.
#
# Human messages are unaffected: this gate applies only to other bots.
# Verified against adapter.py:6113 and adapter.py:5753 (default false).
platforms:
  telegram:
    enabled: true
    bots_require_mention: true

platform_hints:
  telegram: "You are in a Telegram Forum Topic. Keep replies short, scannable, with citations (path:line for files, skill names for native skills). Stay scoped to this topic's project. Never leak other projects' data into this topic."
  tui: "You are in a TUI session. Verbose, structured output is acceptable. Always cite sources for factual claims."
  api: "You are serving an API caller. Return structured, complete responses with full citations."

_config_version: 46

# ── Session workspace ──────────────────────────────────────────────────────
# The workspace a session starts attached to. Bridges to the runtime's
# TERMINAL_CWD, which is the second link in the resolution chain — the first
# is the cwd pinned on the session itself when the user attaches a different
# one. Plugins resolve research, planning and git against whatever workspace
# is attached; see the `agents` skill. Change this only to move the default.
terminal:
  backend: "local"
  cwd: "/opt/data/workspace"

# ── Tools & Tool Exposure ─────────────────────────────────────────────
tools:
  tool_search:
    enabled: "off"

# ── Skills (native — pai-stack skills mounted read-only from ./skills) ──
skills:
  external_dirs:
    - /opt/pai/skills

# ── Plugins ────────────────────────────────────────────────────────────────
plugins:
  enabled:
    - observability/langfuse
    - hermes-labyrinth
    - compressor
    - pai_tools
    # Code intelligence via the optional `terrain` profile. Baked into
    # this image (Dockerfile) and enabled — the tool self-hides via check_fn
    # when the profile is not running.
    - pai_terrain_ops
    # Read-only memory inspector (built-in/Mnemosyne/holographic/Mem0/Honcho/
    # Hindsight/ByteRover). Adds the Memory tab to the dashboard; no hooks,
    # no writes, no extra LLM calls.
    - hermes-memory-ui
    # Prompt rewriter (+1 LLM call per 5+ word message). Baked default mode is
    # "off" (patched at build; upstream ships "auto") — opt in per session via
    # `/prompt-optimizer auto`, reports via /prompt-insights.
    - prompt-optimizer
    # Desktop composer suggestion pill (1x max_tokens=100 call per turn on the
    # main gateway model; Telegram/Discord turns are skipped). Toggle via
    # plugins.entries.next-prompt.settings.enabled below.
    - next-prompt
  entries:
    next-prompt:
      settings:
        enabled: true
        max_context_messages: 4
        cooldown_seconds: 3

# ── Compressor Plugin Config ────────────────────────────────────────────────
compressor:
  enabled: true
  max_tool_output_tokens: 500
  max_summary_lines: 10
  dedup_window: 10
  stats_logging: true
