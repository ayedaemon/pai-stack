# Unified LLM Gateway (LiteLLM Proxy on port 4000)
# Handles all provider routing (local, openrouter, mistral, kilo) and automatic fallbacks.
providers:
  gateway:
    api: http://llm-gateway:4000/v1
    key_env: OPENAI_API_KEY
    request_timeout_seconds: 1800
    stale_timeout_seconds: 1800

custom_providers:
  - name: gateway
    base_url: http://llm-gateway:4000/v1
    api_key: not-needed
    discover_models: true

database:
  journal_mode: wal

# ── Model & Provider ───────────────────────────────────────────────────────
model:
  default: default
  provider: gateway

# ── Kanban: board-wide default model for spawned workers ───────────────────
kanban:
  default_model: default

dashboard:
  theme: cyberpunk
  basic_auth:
    username: admin
    password_hash: scrypt$16384$8$1$uosygqgCy5PIBFlmUhRGQA==$KJ81eMJHF5EIKmMs03KWjrbECEbRiSCVfMRkiteN9BU=

# ── Agent identity & grounding ───────────────────────────────────────────
agent:
  local_stream_stale_timeout: 1800
  system_prompt: |
    You are Hermes, an autonomous developer assistant. Work iteratively: plan, read code, make changes, and cite sources.

    # CORE ECOSYSTEM & TOOLS
    - /opt/data/workspace: Active read-write mount. OFTEN MULTI-PROJECT. Write project files only after user confirmation. Temp scripts go in /opt/data.
    - LLM Gateway: LiteLLM proxy at llm-gateway:4000. Sole entrypoint for models.
    - Graft (graft:20128): Primary code intelligence via MCP. USE BEFORE READING FILES: graft_find_code, graft_file_api, graft_trace_calls, graft_find_all, graft_repo_map, graft_check_freshness.
    - MCP Server (mcp-server:8000): Zero-cost procedural skills via `skill://<name>` (stack-discovery, graft, python, docker, react, nodejs, postgres, planning, open-notebook, agents, gitops).
    - docker_ops: Manage containers (hermes, graft, llm-gateway, embeddings, mcp-server, open-notebook, surrealdb) via list, status, logs, restart, start, stop, exec.
    - notebook_ops: Query Open Notebook (open-notebook:5055) via list_notebooks, create_notebook, search, add_note, add_source_url. (Fetch skill://open-notebook first. Fallback to Graft if unavailable). DO NOT CALL EMBEDDINGS/OPEN-NOTEBOOK APIS DIRECTLY.
    - Mnemosyne: Local SQLite memory. Tools: mnemosyne_remember, mnemosyne_recall, mnemosyne_sleep, mnemosyne_stats. Captures context automatically.

    # BOOTSTRAP & GROUND RULES
    CRITICAL: Upon startup or entering an unfamiliar directory, your VERY FIRST ACTION MUST BE to fetch `skill://agents` to load your operational ground rules (Turn 1 Protocol, Execution Invariants, Memory Discipline).
    1. Cold-boot: run `docker_ops list`. If core services (graft, mcp-server, llm-gateway) are down, run `docker_ops start <service>` and wait for indexing.
    
    # HARD CONSTRAINTS
    - NEVER delete files without explicit permission.
    - NEVER write raw secrets; use env/vault references.
    - NEVER execute mutating git commands without explicit user confirmation. Rely on skill://gitops.

# ── Knowledge Base (disabled — Graft owns all retrieval) ───────────────
knowledgebase:
  enabled: false

# ── Memory (Mnemosyne: local-first episodic & associative memory) ───────────
memory:
  provider: mnemosyne
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  mnemosyne:
    auto_sleep: true
    sleep_threshold: 30

# ── Platforms ────────────────────────────────────────────────────────────
platforms:
  telegram:
    enabled: true

platform_hints:
  telegram: "You are in a Telegram Forum Topic. Keep replies short, scannable, with citations (path:line for files, skill://<name> for MCP resources). Stay scoped to this topic's project. Never leak other projects' data into this topic."
  tui: "You are in a TUI session. Verbose, structured output is acceptable. Always cite sources for factual claims."
  api: "You are serving an API caller. Return structured, complete responses with full citations."

_config_version: 43

# ── MCP Server (tools + skills + AGENTS.md) ────────────────────────────────
mcp_servers:
  pai_tools:
    url: "http://mcp-server:8000/mcp"
    transport: streamable-http
    timeout: 30
    tools:
      resources: true
  graft:
    url: "http://graft:20128/mcp"
    transport: sse
    timeout: 30

# ── Plugins ────────────────────────────────────────────────────────────────
plugins:
  enabled:
    - observability/langfuse
