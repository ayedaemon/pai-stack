services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.5"
    ports:
      - "20128:20128"  # OmniRoute
      - "9119:9119"    # Hermes Dashboard
      - "8642:8642"    # Hermes API
      - "7070:7070"    # SilverBullet
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
    depends_on:
      omniroute:
        condition: service_healthy
      hermes:
        condition: service_started
      silverbullet:
        condition: service_started

  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    user: "${UID:-1000}:${GID:-1000}"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      - PRICING_SYNC_ENABLED=false
      - ARENA_ELO_SYNC_ENABLED=false
      - OMNIROUTE_AUTO_FREE_FALLBACK_TO_FULL_POOL=false
      - LOG_LEVEL=warn
    volumes:
      - ./omniroute-data:/app/data
      - ./seed-combos.sh:/app/seed-combos.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('net').createConnection(20128,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\"" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"
    environment:
      - HERMES_HOME=/opt/hermes/data
      - HERMES_UID=${UID:-1000}
      - HERMES_GID=${GID:-1000}
      # Runtime flags (not config settings)
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
      # Basic Auth for Dashboard
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./hermes-data:/opt/hermes/data
      - ./config.yaml:/tmp/config.yaml.host:ro
      - ./hermes-entrypoint.sh:/hermes-entrypoint.sh:ro
      - ~/Personal:/opt/data/Personal
    entrypoint: [ "/bin/sh", "/hermes-entrypoint.sh" ]
    depends_on:
      omniroute:
        condition: service_healthy
    command: gateway run

  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:latest
    container_name: silverbullet
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    environment:
      - SB_USER=${SB_USER:-admin}:${SB_PASSWORD}
    volumes:
      - ~/Personal/silverbullet:/space
