services:
  hermes:
    build:
      context: ./hermes
      dockerfile: Dockerfile
    image: pai-stack-hermes:patched
    container_name: hermes
    restart: unless-stopped
    depends_on:
      mcp-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: "3.0"
    environment:
      - HERMES_HOME=/opt/hermes/data
      - HERMES_UID=${UID:-1000}
      - HERMES_GID=${GID:-1000}
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-""}
      - KILO_GATEWAY_API_KEY=${KILO_GATEWAY_API_KEY:-""}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-""}
      - FS_NOTIFIER_DEBOUNCE_SECONDS=${FS_NOTIFIER_DEBOUNCE_SECONDS:-30}
      - KB_DIRS=${KB_DIRS:-.}
    ports:
      - "9119:9119"
      - "8642:8642"
    volumes:
      - hermes-data:/opt/hermes/data
      - ./hermes/config.yaml:/tmp/hermes-config.yaml.host:ro
      - ./hermes/entrypoint.sh:/hermes-entrypoint.sh:ro
      - ${STACK_ROOT}:/stack_root
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: [ "/bin/sh", "/hermes-entrypoint.sh" ]
    command: gateway run

  codegraph:
    build:
      context: ./codegraph
      dockerfile: Dockerfile
    container_name: codegraph
    restart: unless-stopped
    ports:
      - "20128:20128"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    volumes:
      - ${STACK_ROOT}:/stack_root:ro
      - ${STACK_ROOT}:/codebase:ro # compat: old /codebase alias
      - codegraph-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20128/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  hermes-data:
  codegraph-data:
