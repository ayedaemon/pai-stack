services:
  hermes:
    build:
      context: ./hermes
      dockerfile: Dockerfile
    image: pai-stack-hermes:patched
    container_name: hermes
    restart: unless-stopped
    depends_on:
      mcp-server:
        condition: service_healthy
      graft:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: "3.0"
    environment:
      - HERMES_HOME=/opt/hermes/data
      - HERMES_DATA_DIR=/opt/data/workspace
      - HERMES_LAZY_INSTALL_TARGET=/opt/hermes/data/lazy-packages
      - PYTHONPATH=/opt/hermes/data/lazy-packages
      - LLAMACPP_BASE_URL=${LLAMACPP_BASE_URL:-http://host.docker.internal:8080/v1}
      - LLAMACPP_MODEL_NAME=${LLAMACPP_MODEL_NAME}
      - HERMES_UID=${UID:-1000}
      - HERMES_GID=${GID:-1000}
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - KILO_GATEWAY_API_KEY=${KILO_GATEWAY_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MNEMOSYNE_DATA_DIR=/opt/hermes/data/mnemosyne/data
      - MNEMOSYNE_AUTO_SLEEP_ENABLED=true
      - MNEMOSYNE_AUTO_SLEEP_THRESHOLD=30
      - MNEMOSYNE_SELF_ECHO_ENABLED=1
    ports:
      - "9119:9119"
      - "8642:8642"
    volumes:
      - hermes-data:/opt/hermes/data
      - ./hermes/config.yaml:/tmp/hermes-config.yaml.host:ro
      - type: bind
        source: ${WORKSPACE_DIR}
        target: /opt/data/workspace
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: [ "/bin/sh", "/hermes-entrypoint.sh" ]
    command: gateway run

  graft:
    build:
      context: ./graft
      dockerfile: Dockerfile
    container_name: graft
    restart: unless-stopped
    ports:
      - "20128:20128"
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "1.0"
    environment:
      - WORKSPACE_PATH=/opt/data/workspace
    volumes:
      - type: bind
        source: ${WORKSPACE_DIR}
        target: /opt/data/workspace
        bind:
          create_host_path: false
      - graft-cache:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20128/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-pai-stack}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - mcp-logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  hermes-data:
  graft-cache:
  mcp-logs:
