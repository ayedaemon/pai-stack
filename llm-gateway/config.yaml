      timeout: 1800

  - model_name: mistral/ministral-3b-2512
    litellm_params:
      model: mistral/ministral-3b-2512
      api_key: os.environ/MISTRAL_API_KEY
      timeout: 1800

  - model_name: mistral/ministral-3b-latest
