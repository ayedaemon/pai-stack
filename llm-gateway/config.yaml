# LiteLLM Proxy Configuration for pai-stack
# Centralized LLM gateway managing all model routing and provider credentials.
# NOTE: routes use mistral/ provider mapping (not openai/) so reasoning params
# are stripped pre-flight — see note at primary-models section below.
# NOTE: model entries are alphabetically sorted (case-insensitive) — do not
# hand-reorder; re-running scripts/sync-models.py regenerates this order.
# NOTE: the `default` entry + fallback chain below are latency-ranked
# (fastest probe first) — re-ranked on every run.

model_list:
  # ── Google Gemini ───────────────────────────────────────────────────
  - model_name: gemini/gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      timeout: 1800

  - model_name: gemini/gemini-3.1-flash-lite-preview
    litellm_params:
      model: gemini/gemini-3.1-flash-lite-preview
      api_key: os.environ/GEMINI_API_KEY
      timeout: 1800

  - model_name: gemini/gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 1800

  - model_name: gemini/gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      timeout: 1800

  - model_name: gemini/gemini-3.6-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 1800

  - model_name: gemini/gemini-flash-lite-latest
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY
      timeout: 1800

  - model_name: gemini/gemma-4-26b-a4b-it
    litellm_params:
      model: gemini/gemma-4-26b-a4b-it
      api_key: os.environ/GEMINI_API_KEY
      timeout: 1800

  # ── Kilo Gateway ───────────────────────────────────────────────────
  - model_name: kilo/kilo-auto/free
    litellm_params:
      model: mistral/kilo-auto/free
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_GATEWAY_API_KEY
      timeout: 1800
      drop_params: true

  - model_name: kilo/kilo-auto/small
    litellm_params:
      model: mistral/kilo-auto/small
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_GATEWAY_API_KEY
      timeout: 1800
      drop_params: true

  - model_name: kilo/nvidia/nemotron-3-ultra-550b-a55b:free
    litellm_params:
      model: mistral/nvidia/nemotron-3-ultra-550b-a55b:free
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_GATEWAY_API_KEY
      timeout: 1800
      drop_params: true

  - model_name: kilo/nvidia/nemotron-3.5-lightning:free
    litellm_params:
      model: mistral/nvidia/nemotron-3.5-lightning:free
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_GATEWAY_API_KEY
      timeout: 1800
      drop_params: true

  - model_name: kilo/poolside/laguna-s-2.1:free
    litellm_params:
      model: mistral/poolside/laguna-s-2.1:free
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_GATEWAY_API_KEY
      timeout: 1800
      drop_params: true

  # ── Mistral AI ───────────────────────────────────────────────────
  - model_name: mistral/codestral-2508
    litellm_params:
      model: mistral/codestral-2508
      api_key: os.environ/MISTRAL_API_KEY
      timeout: 1800

  - model_name: mistral/codestral-latest
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY
      timeout: 1800

  - model_name: mistral/ministral-14b-2512
    litellm_params:
      model: mistral/ministral-14b-2512
      api_key: os.environ/MISTRAL_API_KEY
      timeout: 1800

  - model_name: mistral/ministral-14b-latest
    litellm_params:
      model: mistral/ministral-14b-latest
