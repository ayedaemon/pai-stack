      timeout: 1800

  - model_name: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 1800

  - model_name: openrouter/nvidia/nemotron-3.5-lightning:free
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 1800

  # ── Default (fastest live model first, rest via fallbacks) ────────────
  - model_name: default
    litellm_params:
      model: nvidia_nim/nemotron-3.5-content-safety
      api_key: os.environ/NVIDIA_API_KEY
      timeout: 1800

# ── Router Settings ─────────────────────────────────────────────────────
router_settings:
  timeout: 1800              # 30m request timeout for large models & deep reasoning
  stream_timeout: 1800       # 30m chunk timeout for slow reasoning token streams
  fallbacks:
    - {"default": ["mistral/ministral-8b-latest", "mistral/codestral-latest", "nvidia/riva-translate-4b-instruct-v2", "mistral/voxtral-small-latest", "mistral/ministral-8b-2512", "mistral/ministral-3b-2512", "mistral/ministral-3b-latest", "mistral/codestral-2508", "mistral/voxtral-small-2507", "mistral/ministral-14b-2512", "openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", "mistral/mistral-code-fim-latest", "nvidia/google/diffusiongemma-26b-a4b-it", "mistral/mistral-code-latest", "kilo/nvidia/nemotron-3-ultra-550b-a55b:free", "gemini/gemini-flash-lite-latest", "mistral/ministral-14b-latest", "gemini/gemini-3.5-flash-lite", "kilo/poolside/laguna-s-2.1:free", "ollama/gemma4:31b", "gemini/gemma-4-26b-a4b-it", "gemini/gemini-3.1-flash-lite-preview", "kilo/kilo-auto/small", "gemini/gemini-3.1-flash-lite", "gemini/gemini-3.6-flash", "gemini/gemini-3.5-flash", "openrouter/nvidia/nemotron-3.5-lightning:free", "nvidia/nemotron-3.5-lightning-30b-a3b", "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free", "kilo/kilo-auto/free", "nvidia/llama-3.1-nemotron-safety-guard-8b-v3", "nvidia/meta/llama-3.2-11b-vision-instruct", "kilo/nvidia/nemotron-3.5-lightning:free"]}

# ── General Settings ─────────────────────────────────────────────────────
general_settings:
  drop_params: true
  request_timeout: 1800      # 30m global HTTP timeout
