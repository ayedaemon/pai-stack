  - model_name: nvidia/riva-translate-4b-instruct-v2
    litellm_params:
      model: nvidia_nim/riva-translate-4b-instruct-v2
      api_key: os.environ/NVIDIA_API_KEY
      timeout: 1800

  # ── Ollama Cloud ───────────────────────────────────────────────────
  - model_name: ollama/gemma4:31b
    litellm_params:
      model: openai/gemma4:31b
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
      timeout: 1800
      drop_params: true

  # ── OpenRouter ───────────────────────────────────────────────────
  - model_name: openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    litellm_params:
      model: openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
