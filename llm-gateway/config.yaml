# ── Router Settings ─────────────────────────────────────────────────────
router_settings:
  timeout: 1800              # 30m request timeout for large models & deep reasoning
  stream_timeout: 1800       # 30m chunk timeout for slow reasoning token streams
  fallbacks:
    - {"default": ["mistral/codestral-latest", "mistral/ministral-3b-latest", "mistral/mistral-code-fim-latest", "mistral/ministral-3b-2512", "mistral/mistral-code-latest", "mistral/voxtral-small-2507", "mistral/voxtral-small-latest", "mistral/ministral-8b-latest", "mistral/ministral-14b-latest", "mistral/ministral-8b-2512", "kilo/nvidia/nemotron-3-ultra-550b-a55b:free", "kilo/liquid/lfm-2.5-2.6b:free", "mistral/ministral-14b-2512", "kilo/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", "kilo/nvidia/nemotron-3.5-content-safety:free", "kilo/reflection/beam-free", "kilo/openrouter/free", "kilo/poolside/laguna-xs-2.1:free", "kilo/poolside/laguna-s-2.1:free", "kilo/kilo-auto/free", "kilo/nvidia/nemotron-3-super-120b-a12b:free", "spark-x2.5-4b-uncensored", "kilo/cohere/north-mini-code:free", "kilo/dots-studio/dots-3-note-preview:free", "qwen3.8-27b-uncensored", "kilo/xingchen-agi/xing4.0-29b-a4b:free"]}

# ── General Settings ─────────────────────────────────────────────────────
general_settings:
  drop_params: true
  request_timeout: 1800      # 30m global HTTP timeout
