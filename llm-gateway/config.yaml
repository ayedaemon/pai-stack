      timeout: 1800

  - model_name: mistral/voxtral-small-latest
    litellm_params:
      model: mistral/voxtral-small-latest
      api_key: os.environ/MISTRAL_API_KEY
      timeout: 1800

  # ── NVIDIA NIM ───────────────────────────────────────────────────
  - model_name: nvidia/google/diffusiongemma-26b-a4b-it
    litellm_params:
      model: nvidia_nim/google/diffusiongemma-26b-a4b-it
      api_key: os.environ/NVIDIA_API_KEY
      timeout: 1800

  - model_name: nvidia/llama-3.1-nemotron-safety-guard-8b-v3
    litellm_params:
      model: nvidia_nim/llama-3.1-nemotron-safety-guard-8b-v3
      api_key: os.environ/NVIDIA_API_KEY
      timeout: 1800

  - model_name: nvidia/meta/llama-3.2-11b-vision-instruct
    litellm_params:
      model: nvidia_nim/meta/llama-3.2-11b-vision-instruct
      api_key: os.environ/NVIDIA_API_KEY
      timeout: 1800

  - model_name: nvidia/nemotron-3.5-content-safety
