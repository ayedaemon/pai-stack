# ── Router & Fallback Settings ───────────────────────────────────────────
router_settings:
  timeout: 1800              # 30m request timeout for large models & deep reasoning
  stream_timeout: 1800       # 30m chunk timeout for slow reasoning token streams
  fallbacks:
    # Policy (2026-09-25): live cloud first, office2 tail last — tried ONLY after
    # all other providers exhaust. Every group here must exist in model_list above.
    - default:
        - "kilo/kilo-auto/free"
        - "openrouter/inclusionai/ling-3.0-flash-fin:free"
        - "mistral/codestral-latest"
        - "ministral-3-14b-reasoning"
        - "qwen3.5-9b-deepseek-v4-flash"

# ── General Settings ─────────────────────────────────────────────────────
general_settings:
  drop_params: true
  request_timeout: 1800      # 30m global HTTP timeout
