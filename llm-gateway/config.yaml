# LiteLLM Proxy Configuration for pai-stack
# Centralized LLM gateway managing all model routing, fallbacks, and provider credentials.
# NOTE: routes use mistral/ provider mapping (not openai/) so reasoning params
# are stripped pre-flight — see note at primary-models section below.

model_list:
  # ── Primary Default Routing ───────────────────────────────────────────
  # STANDING POLICY (2026-09-27): `default` points at live kilo free. office2 is
  # offline and stays tail-only even after it wakes (reliability over LAN-privacy
  # by explicit decision); office2 routes live in the section below + fallback tail.
  - model_name: default
    litellm_params:
      model: mistral/kilo-auto/free
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_GATEWAY_API_KEY
      timeout: 1800
      drop_params: true

  # ── office2 Last-Resort (OFFLINE, hand-maintained 2026-09-25) ──────────
  # Box down. These exist ONLY so the fallback tail can name them; they are tried
  # last, after every live provider exhausts. `make sync` drops them (no discovery
  # while down) — re-add after any sync until the box wakes. mistral-mapped +
  # drop_params like everything else (reasoning-strip doctrine).
  - model_name: ministral-3-14b-reasoning
    litellm_params:
      model: mistral/mistralai/ministral-3-14b-reasoning
      api_base: os.environ/OPENAI_COMPATIBLE_BASE_URL
      api_key: os.environ/OPENAI_COMPATIBLE_API_KEY
      timeout: 1800
      drop_params: true

  - model_name: qwen3.5-9b-deepseek-v4-flash
    litellm_params:
      model: mistral/qwen3.5-9b-deepseek-v4-flash
      api_base: os.environ/OPENAI_COMPATIBLE_BASE_URL
      api_key: os.environ/OPENAI_COMPATIBLE_API_KEY
      timeout: 1800
      drop_params: true

  # ── Kilo Gateway ───────────────────────────────────────────────────
  # PINNED (2026-09-27, hand-maintained): kilo-auto/free is the primary fallback but
  # kilo's free rotation drops it from discovery — pin statically (id is stable).
  # Re-verify with a direct curl if kilo 400s; delete if kilo retires the id.
  - model_name: kilo/kilo-auto/free
    litellm_params:
      model: mistral/kilo-auto/free
      api_base: https://api.kilo.ai/api/gateway
      api_key: os.environ/KILO_GATEWAY_API_KEY
      timeout: 1800
      drop_params: true
